<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Магазин</title>
    <!-- Подключение библиотеки Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Здесь будет ваш CSS (темная тема, шрифты, кнопки) */
        body { background-color: #121212; color: white; }
    </style>
</head>
<body>
    <h1>Услуги</h1>
    <!-- Ваши товары и кнопки -->
    <button id="orderBtn">Оформить заказ</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Открывает приложение на весь экран

        // Отправка данных обратно в бота (в Python) при нажатии на кнопку
        document.getElementById("orderBtn").addEventListener("click", () => {
            let orderData = {
                service: "Перекрас ганпака",
                price: 100
            };
            tg.sendData(JSON.stringify(orderData)); // Отправляем JSON
        });
    </script>
</body>
</html>
