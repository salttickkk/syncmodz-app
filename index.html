<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SyncModz Store</title>
  <!-- Подключение официального SDK Telegram Mini Apps -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #121214);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e1e24);
      --text: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --btn: var(--tg-theme-button-color, #5865f2);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --accent: #00d26a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 90px; }

    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 22px; font-weight: 700; }
    header p { color: var(--hint); font-size: 14px; margin-top: 4px; }

    .grid { display: flex; flex-direction: column; gap: 12px; }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.1s ease;
    }
    .card:active { transform: scale(0.98); }

    .card-header { display: flex; justify-content: space-between; align-items: baseline; }
    .title { font-size: 16px; font-weight: 600; }
    .price { font-size: 16px; font-weight: 700; color: var(--accent); }
    .desc { font-size: 13px; color: var(--hint); line-height: 1.4; }

    .select-btn {
      margin-top: 6px;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: var(--btn);
      color: var(--btn-text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .select-btn.active {
      background: #e53935;
    }

    /* Нижняя панель подтверждения */
    .footer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      padding: 12px 16px;
      display: none;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 500px;
      margin: 0 auto;
    }
    .order-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>SyncModz Digital</h1>
    <p>Выберите мод или сборку для покупки</p>
  </header>

  <div class="grid" id="catalog"></div>

  <div class="footer-bar" id="footer">
    <div class="footer-content">
      <div>
        <div style="font-size: 12px; color: var(--hint);">К оплате:</div>
        <div style="font-size: 18px; font-weight: bold;" id="total-price">0 ₽</div>
      </div>
      <button class="order-btn" onclick="submitOrder()">Купить сейчас</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // Разворачиваем окно на весь экран смартфона

    // Список товаров (можно менять названия и цены)
    const products = [
      { id: "pack_majestic", title: "Сборка Majestic RP (Low PC)", price: 490, desc: "Оптимизация текстур, дорог и +30 FPS на слабом железе." },
      { id: "script_recoil", title: "Худ + Настройка графики", price: 290, desc: "Кастомный спидометр, радар и приватные шейдеры." },
      { id: "reshade_preset", title: "Приватный пресет ReShade", price: 190, desc: "Сочные цвета и мягкое сглаживание без потери кадров." }
    ];

    let selectedProduct = null;

    function renderCatalog() {
      const container = document.getElementById("catalog");
      container.innerHTML = "";

      products.forEach(p => {
        const isSelected = selectedProduct && selectedProduct.id === p.id;
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-header">
            <span class="title">${p.title}</span>
            <span class="price">${p.price} ₽</span>
          </div>
          <div class="desc">${p.desc}</div>
          <button class="select-btn ${isSelected ? 'active' : ''}" onclick="selectItem('${p.id}')">
            ${isSelected ? 'Отменить выбор' : 'Выбрать'}
          </button>
        `;
        container.appendChild(card);
      });

      const footer = document.getElementById("footer");
      if (selectedProduct) {
        footer.style.display = "block";
        document.getElementById("total-price").innerText = selectedProduct.price + " ₽";
      } else {
        footer.style.display = "none";
      }
    }

    function selectItem(id) {
      if (selectedProduct && selectedProduct.id === id) {
        selectedProduct = null;
      } else {
        selectedProduct = products.find(p => p.id === id);
      }
      renderCatalog();
    }

    // Отправка данных о заказе боту
    function submitOrder() {
      if (!selectedProduct) return;
      
      // Передаем JSON-строку обратно в Telegram-бота
      tg.sendData(JSON.stringify({
        product_id: selectedProduct.id,
        title: selectedProduct.title,
        price: selectedProduct.price
      }));
      
      // Закрываем окно Mini App
      tg.close();
    }

    renderCatalog();
  </script>
</body>
</html>
